<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>勤怠・給与管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f6f8;color:#222}button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer}.primary{background:#222;color:#fff}.light{background:#eceff3}.wrap{max-width:900px;margin:auto;padding:15px}.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:15px;box-shadow:0 2px 12px #0001}.top{display:flex;gap:8px;align-items:center;margin-bottom:14px}.sp{flex:1}.muted{color:#737984;font-size:13px}.hidden{display:none!important}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tabs button{white-space:nowrap}.tabs .on{background:#222;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f1f3f5;border-radius:14px;padding:13px}.stat b{display:block;font-size:23px;margin-top:4px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 7px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{font-size:12px;color:#777}.kiosk{max-width:720px}.clock{text-align:center;font-size:36px;font-weight:800;margin:8px 0 18px}.staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.staff{border:1px solid #e1e4e8;border-radius:15px;padding:15px}.staff button{width:100%;margin-top:9px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:9}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(400px,100%)}input{width:100%;padding:12px;border:1px solid #d8dce2;border-radius:10px;margin:6px 0 12px}.pin{font-size:27px;letter-spacing:8px;text-align:center}.msg{text-align:center;min-height:22px;margin-top:9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>

<div id="kiosk" class="wrap kiosk"><div class="card"><div class="top"><div><h1>🏪 勤怠打刻</h1><div class="muted">店舗の打刻専用画面</div></div><div class="sp"></div><button class="light" onclick="showLogin()">管理者</button></div><div id="clock" class="clock"></div><div class="card" style="background:#fff8df;box-shadow:none">名前 → 4桁暗証番号 → 出勤／退勤 の順で打刻します。</div><div id="names" class="staffgrid"></div></div></div>

<div id="login" class="wrap hidden"><div class="card" style="max-width:420px;margin:60px auto"><h1>🕐 勤怠・給与管理</h1><p class="muted">管理者ログイン</p><input id="email" type="email" placeholder="メールアドレス"><input id="pw" type="password" placeholder="パスワード"><button class="primary" style="width:100%" onclick="login()">ログイン</button><div id="loginMsg" class="msg"></div><button class="light" style="width:100%;margin-top:10px" onclick="showKiosk()">🏪 打刻画面へ</button></div></div>

<div id="admin" class="wrap hidden"><div class="top"><div><h1>🕐 勤怠・給与管理</h1><div class="muted">実際に働いた時間を管理</div></div><div class="sp"></div><button class="light" onclick="showKiosk()">🏪 打刻</button><button class="light" onclick="logout()">ログアウト</button></div>
<div class="tabs"><button class="on" onclick="tab('today',this)">📊 今日</button><button onclick="tab('att',this)">🕐 勤怠</button><button onclick="tab('pay',this)">💰 給与計算</button><button onclick="tab('slip',this)">📄 給与明細</button><button onclick="tab('set',this)">⚙️ スタッフ設定</button></div>
<section id="today"><div class="card"><div class="top"><h2>今日</h2><span id="date" class="muted"></span></div><div class="grid"><div class="stat">出勤<b id="a">0</b></div><div class="stat">退勤済<b id="b">0</b></div><div class="stat">勤務中<b id="c">0</b></div><div class="stat">打刻漏れ候補<b id="d">0</b></div></div></div><div class="card"><h2>今日の勤怠</h2><div id="todayTable" class="scroll"></div></div></section>
<section id="att" class="hidden"><div class="card"><div class="top"><h2>月別勤怠</h2><div class="sp"></div><input id="month" type="month" style="width:auto;margin:0" onchange="loadMonth()"></div><div id="monthTable" class="scroll"></div></div></section>
<section id="pay" class="hidden"><div class="card"><h2>💰 給与計算</h2><p class="muted">次の段階で、時給・研修時給・22時以降の深夜割増・休憩控除を接続します。</p><button class="primary" onclick="alert('給与計算の詳細機能は次の段階で追加します😊')">給与計算</button></div></section>
<section id="slip" class="hidden"><div class="card"><h2>📄 給与明細</h2><p class="muted">給与確定後、スタッフ別の給与明細PDFを発行する画面です。</p></div></section>
<section id="set" class="hidden"><div class="card"><h2>⚙️ スタッフ設定</h2><p class="muted">店舗打刻用の4桁暗証番号を設定します。</p><div id="settings"></div></div></section>
</div>

<div id="pinModal" class="modal hidden"><div class="modalbox"><h2 id="pinName"></h2><input id="pin" class="pin" inputmode="numeric" maxlength="4" placeholder="••••"><div class="row"><button class="light" onclick="closePin()">キャンセル</button><div class="sp"></div><button class="primary" onclick="punch()">次へ</button></div><div id="pinMsg" class="msg"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://eroyuafrsntfszvoplrv.supabase.co',KEY='sb_publishable_TJT6cTkWmPHsjMBusx0r0w__x3f77yG',sb=supabase.createClient(URL,KEY);
let staff=[],selected=null;const $=x=>document.getElementById(x),today=()=>new Date().toLocaleDateString('sv-SE'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hide(x){$(x).classList.add('hidden')}function show(x){$(x).classList.remove('hidden')}function showKiosk(){hide('login');hide('admin');show('kiosk');loadKiosk()}function showLogin(){hide('kiosk');show('login')}
async function loadKiosk(){let r=await sb.rpc('get_kiosk_staff');if(r.error){$('names').innerHTML='<p>'+esc(r.error.message)+'</p>';return}staff=r.data||[];$('names').innerHTML=staff.map(s=>`<div class="staff"><b>${s.is_newcomer?'🔰 ':''}${esc(s.name)}</b><button class="light" onclick="selectStaff('${s.id}')">この人で打刻</button></div>`).join('')||'<p>スタッフがいません。</p>'}
function selectStaff(id){selected=staff.find(s=>s.id===id);if(!selected)return;$('pinName').textContent=selected.name+' さん';$('pin').value='';$('pinMsg').textContent='';show('pinModal');setTimeout(()=>$('pin').focus(),50)}
function closePin(){hide('pinModal');selected=null}
async function punch(){let pin=$('pin').value.trim();if(!/^\d{4}$/.test(pin)){ $('pinMsg').textContent='4桁の暗証番号を入力してください';return}let r=await sb.rpc('kiosk_punch',{p_staff_id:selected.id,p_pin:pin,p_work_date:today()});if(r.error){$('pinMsg').textContent=r.error.message;return}if(r.data?.error){$('pinMsg').textContent=r.data.error;return}$('pinMsg').textContent=r.data.action==='in'?'出勤しました！':'退勤しました！';setTimeout(closePin,800)}
async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});if(r.error){$('loginMsg').textContent=r.error.message;return}enterAdmin()}
async function enterAdmin(){hide('kiosk');hide('login');show('admin');$('month').value=today().slice(0,7);await loadToday();await loadMonth();await loadSettings()}
async function logout(){await sb.auth.signOut();showKiosk()}
async function loadToday(){let r=await sb.from('attendance').select('staff(name,is_newcomer),clock_in,clock_out').eq('work_date',today()).order('clock_in');if(r.error){$('todayTable').innerHTML='<p>'+esc(r.error.message)+'</p>';return}let x=r.data||[];$('date').textContent=today();$('a').textContent=x.length;$('b').textContent=x.filter(v=>v.clock_out).length;$('c').textContent=x.filter(v=>!v.clock_out).length;$('d').textContent=x.filter(v=>!v.clock_out).length;$('todayTable').innerHTML='<table><thead><tr><th>スタッフ</th><th>出勤</th><th>退勤</th><th>状態</th></tr></thead><tbody>'+x.map(v=>`<tr><td>${v.staff?.is_newcomer?'🔰 ':''}${esc(v.staff?.name)}</td><td>${time(v.clock_in)}</td><td>${time(v.clock_out)}</td><td>${v.clock_out?'退勤済':'勤務中'}</td></tr>`).join('')+'</tbody></table>'}
function time(v){return v?new Date(v).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'-'}
async function loadMonth(){let m=$('month').value;if(!m)return;let d=new Date(+m.slice(0,4),+m.slice(5,7),1),end=d.toLocaleDateString('sv-SE');let r=await sb.from('attendance').select('work_date,clock_in,clock_out,staff(name,is_newcomer)').gte('work_date',m+'-01').lt('work_date',end).order('work_date').order('clock_in');if(r.error){$('monthTable').innerHTML='<p>'+esc(r.error.message)+'</p>';return}$('monthTable').innerHTML='<table><thead><tr><th>日付</th><th>スタッフ</th><th>出勤</th><th>退勤</th><th>実働</th></tr></thead><tbody>'+(r.data||[]).map(v=>`<tr><td>${v.work_date}</td><td>${v.staff?.is_newcomer?'🔰 ':''}${esc(v.staff?.name)}</td><td>${time(v.clock_in)}</td><td>${time(v.clock_out)}</td><td>${v.clock_out?(((new Date(v.clock_out)-new Date(v.clock_in))/3600000).toFixed(2)+'h'):'-'}</td></tr>`).join('')+'</tbody></table>'}
async function loadSettings(){let r=await sb.from('staff').select('id,name,role,is_newcomer,attendance_pin').eq('active',true).order('name');if(r.error)return;staff=r.data||[];$('settings').innerHTML=staff.map(s=>`<div class="card" style="margin:8px 0;padding:13px"><div class="row"><div class="sp"><b>${s.is_newcomer?'🔰 ':''}${esc(s.name)}</b><div class="muted">${esc(s.role||'')}</div></div><input id="pin_${s.id}" value="${esc(s.attendance_pin||'')}" maxlength="4" inputmode="numeric" placeholder="4桁" style="width:90px;margin:0"><button class="primary" onclick="savePin('${s.id}')">保存</button></div></div>`).join('')}
async function savePin(id){let v=$('pin_'+id).value.trim();if(!/^\d{4}$/.test(v)){alert('4桁の数字で入力してください');return}let r=await sb.from('staff').update({attendance_pin:v}).eq('id',id);if(r.error)alert(r.error.message);else alert('暗証番号を保存しました')}
function tab(id,btn){['today','att','pay','slip','set'].forEach(hide);show(id);document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');if(id==='today')loadToday();if(id==='att')loadMonth();if(id==='set')loadSettings()}
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('ja-JP')},500);showKiosk();
</script></body></html>
